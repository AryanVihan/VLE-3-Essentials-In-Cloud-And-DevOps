<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps CI/CD Web App</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            max-width: 600px;
        }

        h1 {
            color: #222;
        }

        p {
            color: #555;
            font-size: 18px;
        }

        .status {
            margin-top: 25px;
            padding: 12px;
            background: #e8f5e9;
            border-radius: 8px;
            color: #2e7d32;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>DevOps Application</h1>

        <p>
            This website is deployed using an automated DevOps pipeline.
        </p>

        <div class="status">
            CI/CD Pipeline Active
        </div>

    </div>

</body>
</html>
