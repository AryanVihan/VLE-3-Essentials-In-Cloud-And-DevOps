name: CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Verify Application Files
        run: |
          echo "Checking application files..."
          test -f webapp/index.html
          echo "webapp/index.html found successfully."

      - name: Build Application
        run: |
          echo "Starting build..."
          mkdir -p build
          cp webapp/index.html build/index.html
          echo "Build completed successfully."

      - name: Test Application
        run: |
          echo "Running basic application test..."
          test -f build/index.html
          grep -q "DevOps CI/CD Web Application" build/index.html
          echo "Application test passed."

      - name: Generate Build Information
        run: |
          echo "================================="
          echo "CI BUILD INFORMATION"
          echo "================================="
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Build completed successfully."