name: CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Verify Application Files
        run: |
          echo "Checking application files..."
          test -f webapp/index.html
          echo "index.html found successfully."

      - name: Build Application
        run: |
          echo "Starting build..."
          mkdir -p build
          cp webapp/index.html build/index.html
          echo "Build completed successfully."

      - name: Test Application
        run: |
          echo "Running basic application test..."
          test -f build/index.html
          grep -q "DevOps CI/CD Web Application" build/index.html
          echo "Application test passed."

      - name: Generate Build Information
        run: |
          echo "================================="
          echo "CI BUILD INFORMATION"
          echo "================================="
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Build completed successfully."

      - name: Notify Slack - Success
        if: success()
        run: |
          curl -X POST \
            -H 'Content-type: application/json' \
            --data '{
              "text": "✅ CI Build Successful\nRepository: ${{ github.repository }}\nBranch: ${{ github.ref_name }}\nCommit: ${{ github.sha }}"
            }' \
            "${{ secrets.SLACK_WEBHOOK_URL }}"

      - name: Notify Slack - Failure
        if: failure()
        run: |
          curl -X POST \
            -H 'Content-type: application/json' \
            --data '{
              "text": "❌ CI Build Failed\nRepository: ${{ github.repository }}\nBranch: ${{ github.ref_name }}\nCommit: ${{ github.sha }}"
            }' \
            "${{ secrets.SLACK_WEBHOOK_URL }}"